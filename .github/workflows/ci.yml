name: CI

on:
  pull_request:
  push:
    branches: [main]

# Só leitura: a CI não precisa escrever nada no repo.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: testes e typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 22 é o mínimo (node:sqlite); 24 é o que roda no dia a dia.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Build de produção do Cofu (Next.js): pega erro que o typecheck não pega.
      - run: npm run build -w @teko/cofu

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teko</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #legenda {
      position: absolute; z-index: 2; left: 50%; bottom: 26px; transform: translateX(-50%);
      box-sizing: border-box; width: calc(100% - 36px); max-height: 210px;
      padding: 12px 15px; border: 1px solid rgba(95, 212, 255, 0.3); border-radius: 12px;
      background: rgba(5, 7, 10, 0.82); backdrop-filter: blur(8px);
      font: 500 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      color: #f2f7ff; text-align: center; letter-spacing: 0.02em;
      text-shadow: 0 0 5px rgba(46, 155, 255, 0.55), 0 0 2px #000;
      opacity: 0; transition: opacity 250ms, transform 250ms;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      overflow: auto; overflow-wrap: anywhere; white-space: pre-wrap;
    }
    #legenda.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    #legenda:not(.on) { transform: translateX(-50%) translateY(5px); }
    #legenda .quem { color: #5fd4ff; text-transform: uppercase; font-size: 10px; line-height: 1.2; letter-spacing: 0.18em; display: block; flex: 0 0 auto; }
    #legenda .resposta { display: block; width: 100%; }
    #gestos-camera {
      position: fixed!important; left: -10000px!important; top: -10000px!important;
      width: 1px!important; height: 1px!important; visibility: hidden!important;
      opacity: 0!important; pointer-events: none!important; clip-path: inset(50%)!important;
    }
    #gestos-preview {
      /* Proporcional à janela: cresce e diminui junto com a aura (no padrão dá 272x204). */
      position: fixed; inset: auto; left: 50%; top: 50%;
      width: calc(min(100vw, 100vh) * 0.591); height: calc(min(100vw, 100vh) * 0.443);
      visibility: hidden; opacity: 0; pointer-events: none;
      transform: translate(-50%, -50%) scaleX(-1);
      z-index: 4; transition: opacity 180ms;
    }
    #gestos-preview.ativa {
      visibility: visible; opacity: 1;
    }
    #gesto-status {
      position: fixed; z-index: 5; top: 12px; left: 50%; transform: translateX(-50%);
      max-width: calc(100% - 28px); padding: 6px 10px; border-radius: 999px;
      border: 1px solid rgba(95,212,255,.28); background: rgba(5,9,16,.78);
      color: #d9f5ff; font: 11px/1.3 ui-monospace, "SF Mono", Menlo, monospace;
      text-align: center; opacity: 0; transition: opacity 180ms; pointer-events: none;
    }
    #gesto-status.on { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="aura"></canvas>
  <div id="gesto-status" aria-live="polite"></div>
  <div id="legenda" aria-live="polite"></div>
  <canvas id="gestos-preview" aria-hidden="true"></canvas>
  <video id="gestos-camera" aria-hidden="true" muted playsinline></video>
  <script type="module" src="voz.js"></script>
</body>
</html>

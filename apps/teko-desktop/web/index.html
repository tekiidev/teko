<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teko</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #legenda {
      position: absolute; left: 24px; right: 24px; bottom: 26px;
      font: 500 13px/1.35 ui-monospace, "SF Mono", Menlo, monospace;
      color: #f2f7ff; text-align: center; letter-spacing: 0.02em;
      text-shadow: 0 0 10px rgba(46, 155, 255, 0.9), 0 0 2px #000;
      opacity: 0; transition: opacity 250ms;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }
    #legenda.on { opacity: 1; }
    #legenda .quem { color: #5fd4ff; text-transform: uppercase; font-size: 10px; letter-spacing: 0.18em; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <canvas id="aura"></canvas>
  <div id="legenda" aria-live="polite"></div>
  <script type="module" src="voz.js"></script>
</body>
</html>

[package]
name = "teko-desktop"
version = "0.1.0"
description = "Teko no Mac"
authors = ["tekidev"]
license = "AGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }

# Ilha do notch: nível da janela acima da barra de menu e medida do notch (só no Mac).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSResponder"] }

[profile.release]
strip = true
lto = true
